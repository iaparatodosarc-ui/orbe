<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;font-family:"Segoe UI",system-ui,sans-serif}
  /* #orb es la zona que se toca (fija); #body es lo que se ve y se mueve */
  #orb{position:absolute;left:18px;top:28px;width:84px;height:84px;border-radius:50%;cursor:grab;perspective:300px}
  #orb.drag{cursor:grabbing}
  #body{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#3a3a40 0%,#16161a 55%,#050506 100%);
    box-shadow:0 6px 22px rgba(0,0,0,.45),inset 0 -6px 14px rgba(0,0,0,.6);transition:transform .15s;transform-origin:50% 60%}
  #orb:hover #body{transform:scale(1.05)} #orb.drag #body{transform:scale(.92)}
  svg{position:absolute;inset:-8px;width:100px;height:100px;pointer-events:none}
  .ring{fill:none;stroke-width:3;transition:stroke .3s}
  #eyeW{position:absolute;left:22px;top:28px;width:40px;height:28px;border-radius:50%/60%;background:#f4f2ec;overflow:hidden;transition:height .12s,top .12s,width .12s,left .12s}
  #pupil{position:absolute;width:16px;height:16px;border-radius:50%;background:#111;left:12px;top:6px;box-shadow:inset 0 0 0 3px #ff5a1f;transition:transform .15s}
  #pupil::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;left:3px;top:3px}
  #heart{position:absolute;left:0;right:0;top:-2px;text-align:center;font-size:22px;line-height:30px;color:#ff3d6e;display:none}
  #eyeW.love #pupil{display:none} #eyeW.love #heart{display:block}
  #eyeW.wide{height:34px;top:24px;width:44px;left:20px}
  #eyeW.squint{height:8px;top:38px}
  #cheek{position:absolute;left:12px;right:12px;top:58px;height:8px;display:flex;justify-content:space-between;opacity:0;transition:opacity .2s}
  #cheek i{width:12px;height:6px;border-radius:50%;background:#ff5a1f;opacity:.55}
  #body.blush #cheek{opacity:1}
  #fx{position:absolute;left:0;top:0;width:120px;height:140px;pointer-events:none;overflow:visible}
  .spark{position:absolute;font-size:14px;opacity:0;animation:spark .9s ease-out forwards}
  @keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r))}}

  #label{position:absolute;left:112px;top:52px;max-width:180px;padding:7px 12px;border-radius:12px;background:rgba(17,18,20,.92);
    color:#f6f6f2;font-size:12px;line-height:1.3;opacity:0;transform:translateX(-6px);transition:all .25s;pointer-events:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid #333}
  #label.show{opacity:1;transform:none}
  #label b{color:#ff5a1f;font-weight:700}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .spin{transform-origin:50px 50px;animation:spin 1.1s linear infinite}
  .pulse{animation:pulse 1s ease-in-out infinite}

  /* ---------- reacciones al tocarlo ---------- */
  @keyframes boing{0%{transform:scale(1)}20%{transform:scale(1.18,.8)}40%{transform:scale(.88,1.14)}60%{transform:scale(1.07,.94)}80%{transform:scale(.97,1.03)}100%{transform:scale(1)}}
  @keyframes giggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-13deg)}30%{transform:rotate(11deg)}45%{transform:rotate(-9deg)}60%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
  @keyframes whirl{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(.88)}100%{transform:rotate(360deg) scale(1)}}
  @keyframes hop{0%{transform:translateY(0) scale(1)}12%{transform:translateY(2px) scale(1.12,.86)}45%{transform:translateY(-24px) scale(.94,1.08)}75%{transform:translateY(0) scale(1.14,.86)}88%{transform:translateY(-4px) scale(.98,1.02)}100%{transform:translateY(0) scale(1)}}
  @keyframes shiver{0%,100%{transform:translate(0)}10%{transform:translate(-3px,1px)}20%{transform:translate(3px,-1px)}30%{transform:translate(-3px,0)}40%{transform:translate(3px,1px)}50%{transform:translate(-2px,-1px)}60%{transform:translate(2px,0)}70%{transform:translate(-2px,1px)}80%{transform:translate(1px,0)}}
  @keyframes jelly{0%,100%{transform:scale(1)}25%{transform:scale(.86,1.16)}50%{transform:scale(1.12,.9)}65%{transform:scale(.95,1.06)}80%{transform:scale(1.03,.97)}}
  @keyframes gasp{0%{transform:scale(1)}20%{transform:scale(1.2)}70%{transform:scale(1.14)}100%{transform:scale(1)}}
  @keyframes tilt{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(14deg)}}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.12)}60%{transform:scale(1)}}
  @keyframes dizzy{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) translateX(-2px)}50%{transform:rotate(6deg) translateX(2px)}75%{transform:rotate(-5deg)}}
  @keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
  @keyframes peek{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px) rotate(-6deg)}70%{transform:translateX(6px) rotate(6deg)}}
  @keyframes happy{0%{transform:translateY(0)}20%{transform:translateY(-16px) rotate(-8deg)}40%{transform:translateY(0) scale(1.1,.9)}60%{transform:translateY(-10px) rotate(8deg)}80%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
  #body.a-boing{animation:boing .7s ease-out}
  #body.a-giggle{animation:giggle .75s ease-in-out}
  #body.a-whirl{animation:whirl .7s cubic-bezier(.4,.1,.3,1)}
  #body.a-hop{animation:hop .75s ease-out}
  #body.a-shiver{animation:shiver .5s linear}
  #body.a-jelly{animation:jelly .7s ease-out}
  #body.a-gasp{animation:gasp .8s ease-out}
  #body.a-wink{animation:tilt .8s ease-in-out}
  #body.a-love{animation:beat 1s ease-in-out}
  #body.a-dizzy{animation:dizzy .9s ease-in-out}
  #body.a-flip{animation:flip .75s ease-in-out}
  #body.a-peek{animation:peek 1s ease-in-out}
  #body.a-happy{animation:happy 1s ease-out}
  #body.a-sleepy{animation:tilt 1.4s ease-in-out}
</style></head>
<body>
<div id="orb">
  <div id="body">
    <svg viewBox="0 0 100 100">
      <circle class="ring" id="ring" cx="50" cy="50" r="46" stroke="#55555c" stroke-dasharray="6 6"/>
      <circle class="ring" id="arc" cx="50" cy="50" r="46" stroke="#ff5a1f" stroke-dasharray="70 220" style="display:none"/>
    </svg>
    <div id="eyeW"><div id="pupil"></div><div id="heart">♥</div></div>
    <div id="cheek"><i></i><i></i></div>
  </div>
</div>
<div id="fx"></div>
<div id="label"></div>
<script>
const ES=(navigator.language||'es').toLowerCase().startsWith('es');
const L=ES?{drop:'Suéltame sobre una ventana…',look:'Mirando…',full:'Pantalla completa',see:'Viendo:'}:{drop:'Drop me on a window…',look:'Looking…',full:'Full screen',see:'Watching:'};
const $=id=>document.getElementById(id);
const orb=$('orb'),body=$('body'),ring=$('ring'),arc=$('arc'),pupil=$('pupil'),eyeW=$('eyeW'),label=$('label'),fx=$('fx');
let dragging=false,moved=false,down=null,timer=null,target=null,labelT=null,eyeBusy=false,blinkBusy=false;

/* =================== SONIDO (sintetizado, sin archivos) =================== */
let ac=null,master=null,soundOn=true,vol=0.6;
function audio(){ if(!ac){ac=new AudioContext();master=ac.createGain();master.connect(ac.destination);} master.gain.value=vol*0.4; if(ac.state==='suspended')ac.resume(); return ac; }
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
// tono con barrido de frecuencia y envolvente
function tone(f1,f2,dur,{type='sine',at=0,gain=.5,vib=0,vibRate=18,attack=.01}={}){
  const a=audio(),t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  if(vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=vibRate;lg.gain.value=vib;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+dur);}
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02);
}
// ruido filtrado (para "whoosh", tics)
function noise(dur,{at=0,f1=500,f2=3000,q=2,gain=.4}={}){
  const a=audio(),t=a.currentTime+at,n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=q;
  f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+dur*.25);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur);
}
const SCALES=[[0,2,4,7,9,12,14,16],[0,3,5,7,10,12,15],[0,2,4,5,7,9,11,12],[0,4,7,11,12,16]];
const note=(root,semi)=>root*Math.pow(2,semi/12);
// Cada sonido se arma con valores al azar: aunque se repita la reacción, nunca suena igual.
const SFX={
  boing(k){tone(180*k,640*k,.38,{vib:R(30,70)*k,vibRate:R(14,24),gain:.5});},
  giggle(k){const sc=pick(SCALES),r=R(500,700)*k;for(let i=0;i<5;i++){const n=note(r,sc[Math.floor(R(0,sc.length))]);tone(n,n*R(1.02,1.12),.07,{type:'triangle',at:i*R(.06,.085),gain:.35});}},
  whirl(k){noise(.5,{f1:400*k,f2:3500*k,gain:.3});tone(260*k,900*k,.45,{type:'sine',gain:.2});},
  hop(k){tone(220*k,880*k,.17,{type:'square',gain:.18});tone(320*k,110*k,.14,{at:.5,gain:.45});},
  shiver(k){tone(520*k,480*k,.45,{type:'square',gain:.12,vib:40,vibRate:R(26,40)});},
  jelly(k){tone(700*k,280*k,.16,{gain:.5});tone(560*k,220*k,.16,{at:.17,gain:.4});tone(640*k,250*k,.14,{at:.32,gain:.25});},
  gasp(k){tone(300*k,1250*k,.16,{type:'triangle',gain:.45});noise(.15,{at:.02,f1:2500,f2:4000,gain:.08});},
  wink(k){tone(900*k,1200*k,.07,{type:'triangle',gain:.35});tone(1300*k,1700*k,.09,{type:'triangle',at:.11,gain:.35});},
  love(k){const r=R(380,520)*k;[0,4,7,12].forEach((s,i)=>tone(note(r,s),note(r,s),.32,{at:i*.09,gain:.28,attack:.03}));},
  dizzy(k){tone(820*k,180*k,.75,{vib:70*k,vibRate:R(7,11),gain:.32});},
  flip(k){tone(300*k,1300*k,.3,{type:'sawtooth',gain:.07});tone(1300*k,350*k,.3,{type:'sine',at:.3,gain:.25});},
  peek(k){noise(.03,{f1:3000,f2:3200,q:8,gain:.5});noise(.03,{at:.33,f1:2600,f2:2800,q:8,gain:.5});tone(1500*k,1500*k,.05,{at:.66,type:'triangle',gain:.2});},
  sleepy(k){tone(330*k,240*k,.6,{type:'sine',gain:.25,attack:.15});tone(250*k,200*k,.7,{at:.55,gain:.18,attack:.2});},
  happy(k){const r=R(420,560)*k;[0,4,7,12,16].forEach((s,i)=>tone(note(r,s),note(r,s)*1.01,.18,{type:'triangle',at:i*.07,gain:.3}));},
  pickup(k){tone(400*k,700*k,.08,{type:'triangle',gain:.25});},
  plop(k){tone(500*k,140*k,.14,{gain:.45});},
  done(k){const r=R(880,1046)*k;tone(r,r,.4,{gain:.18,attack:.005});tone(r*1.5,r*1.5,.5,{at:.08,gain:.12,attack:.005});},
};
function play(name){ if(!soundOn||!SFX[name])return; try{SFX[name](R(.85,1.25));}catch{} }

/* =================== MOVIMIENTO =================== */
const REACTIONS=['boing','giggle','whirl','hop','shiver','jelly','gasp','wink','love','dizzy','flip','peek','sleepy'];
let last=[],animT=null;
function chooseReaction(){ // nunca repite ninguna de las últimas 4
  const opts=REACTIONS.filter(r=>!last.includes(r)); const r=pick(opts); last.push(r); if(last.length>4)last.shift(); return r;
}
function sparks(chars,n=6){
  for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spark';s.textContent=pick(chars);
    const a=R(-Math.PI,0),d=R(30,60);s.style.left=(60+R(-8,8))+'px';s.style.top=(70+R(-8,8))+'px';
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.setProperty('--r',R(-90,90)+'deg');
    s.style.color=pick(['#ff5a1f','#ffd166','#f4f2ec','#ff3d6e']);s.style.animationDelay=R(0,.15)+'s';fx.appendChild(s);setTimeout(()=>s.remove(),1300);}
}
function setPupil(x,y){pupil.style.left=x+'px';pupil.style.top=y+'px';}
function eyeScript(steps){ // [[ms, fn], ...] mueve el ojo durante la reacción
  eyeBusy=true;let t=0;steps.forEach(([ms,fn])=>{t+=ms;setTimeout(fn,t);});setTimeout(()=>{eyeBusy=false;eyeW.className='';body.classList.remove('blush');},t+120);
}
function react(kind){
  kind=kind||chooseReaction();
  body.className='';void body.offsetWidth;body.classList.add('a-'+kind);
  clearTimeout(animT);animT=setTimeout(()=>body.classList.remove('a-'+kind),1500);
  play(kind);
  switch(kind){
    case 'love': eyeW.className='love';body.classList.add('blush');sparks(['♥','♡','❤'],5);eyeScript([[1100,()=>{}]]);break;
    case 'gasp': eyeW.className='wide';eyeScript([[100,()=>setPupil(12,9)],[700,()=>{}]]);break;
    case 'wink': eyeW.className='squint';eyeScript([[380,()=>{}]]);break;
    case 'sleepy': eyeW.className='squint';eyeScript([[900,()=>{eyeW.className='';}],[200,()=>{}]]);break;
    case 'dizzy': {let a=0;const iv=setInterval(()=>{a+=.6;setPupil(12+Math.cos(a)*9,6+Math.sin(a)*5);},30);eyeScript([[900,()=>clearInterval(iv)]]);break;}
    case 'peek': eyeScript([[10,()=>setPupil(1,6)],[330,()=>setPupil(23,6)],[330,()=>setPupil(12,6)],[200,()=>{}]]);break;
    case 'giggle': body.classList.add('blush');eyeW.className='squint';eyeScript([[700,()=>{}]]);break;
    case 'whirl': case 'flip': sparks(['✦','✧','·'],5);eyeScript([[700,()=>{}]]);break;
    case 'hop': sparks(['✦','·'],3);break;
    case 'happy': eyeW.className='squint';body.classList.add('blush');sparks(['✦','★','♥'],7);eyeScript([[1000,()=>{}]]);break;
  }
}

/* =================== ARRASTRE / CLIC =================== */
orb.addEventListener('mouseenter',()=>{orbe.mouseIgnore(false);if(target)showLabel();});
orb.addEventListener('mouseleave',()=>{if(!dragging)orbe.mouseIgnore(true);if(!dragging)hideLabel(800);});
orb.addEventListener('contextmenu',e=>{e.preventDefault();orbe.menu();});
orb.addEventListener('pointerdown',e=>{if(e.button!==0)return;audio();orb.setPointerCapture(e.pointerId);dragging=true;moved=false;down={x:e.screenX,y:e.screenY};
  orbe.dragStart();timer=setInterval(()=>orbe.dragMove(),16);});
orb.addEventListener('pointermove',e=>{if(dragging&&down&&Math.hypot(e.screenX-down.x,e.screenY-down.y)>4){if(!moved){moved=true;orb.classList.add('drag');play('pickup');setLabel(L.drop);showLabel();}}});
orb.addEventListener('pointerup',async e=>{if(!dragging)return;dragging=false;clearInterval(timer);orb.classList.remove('drag');
  try{orb.releasePointerCapture(e.pointerId);}catch{}
  if(!moved){react();orbe.click();return;}
  play('plop');setLabel(L.look);const t=await orbe.dragEnd(true);
  if(t){setTarget(t);showLabel();hideLabel(2600);react('jelly');}else{setLabel(L.full);hideLabel(1600);}});

function setLabel(h){label.innerHTML=h;}
function showLabel(){clearTimeout(labelT);label.classList.add('show');}
function hideLabel(ms){clearTimeout(labelT);labelT=setTimeout(()=>label.classList.remove('show'),ms);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function setTarget(t){target=t;if(t)setLabel(`<b>${L.see}</b> ${esc(t.title)}`);}

let lastState='idle';
orbe.on('target',t=>{setTarget(t);});
orbe.on('sound',s=>{soundOn=!!s.on;vol=typeof s.volume==='number'?s.volume:.6;if(master)master.gain.value=vol*.4;});
orbe.on('react',k=>react(k));
orbe.on('state',s=>{
  if(lastState==='speaking'&&s!=='speaking'&&s!=='thinking')play('done');
  lastState=s;
  arc.style.display='none';arc.classList.remove('spin');ring.classList.remove('pulse','spin');
  ring.setAttribute('stroke-dasharray','6 6');ring.setAttribute('stroke','#55555c');
  if(s==='locked'){ring.setAttribute('stroke','#ff5a1f');ring.setAttribute('stroke-dasharray','');}
  if(s==='scanning'){ring.setAttribute('stroke','#ff5a1f');ring.classList.add('spin');}
  if(s==='thinking'){arc.style.display='';arc.classList.add('spin');}
  if(s==='speaking'){ring.setAttribute('stroke','#ff5a1f');ring.setAttribute('stroke-dasharray','');ring.classList.add('pulse');}
});
orbe.on('cursor',({dx,dy})=>{if(eyeBusy)return;const d=Math.hypot(dx,dy)||1,k=Math.min(1,d/300);setPupil(12+dx/d*k*11,6+dy/d*k*6);});
// parpadeo
setInterval(()=>{if(eyeBusy)return;eyeW.style.height='3px';eyeW.style.top='40px';setTimeout(()=>{eyeW.style.height='';eyeW.style.top='';},130);},4200+Math.random()*1500);
// de vez en cuando se mueve un poquito solo (sin sonido)
setInterval(()=>{if(dragging||eyeBusy||Math.random()<.5)return;const k=pick(['peek','jelly']);body.className='';void body.offsetWidth;body.classList.add('a-'+k);
  if(k==='peek')eyeScript([[10,()=>setPupil(1,6)],[330,()=>setPupil(23,6)],[330,()=>setPupil(12,6)],[200,()=>{}]]);
  setTimeout(()=>body.classList.remove('a-'+k),1200);},45000);
</script>
</body></html>
