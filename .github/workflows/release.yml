name: Publicar version

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: orbe-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: orbe-linux
          path: |
            dist/*.AppImage
            dist/latest-linux.yml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/orbe.jks"
            echo "ORBE_KEYSTORE=$RUNNER_TEMP/orbe.jks" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK
        env:
          ORBE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORBE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORBE_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then export ORBE_VERSION_NAME="${GITHUB_REF_NAME#v}"; else export ORBE_VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}-prueba"; fi
          gradle -p android assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Orbe-Android-${ORBE_VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: orbe-android
          path: out/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Empaquetar Orbe Motion
        run: |
          cd src && zip -r "../out/OrbeMotion-Windows-${GITHUB_REF_NAME#v}.zip" orbe-motion
      - uses: softprops/action-gh-release@v2
        with:
          name: Orbe ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
