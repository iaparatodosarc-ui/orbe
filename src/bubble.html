<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;font-family:"Segoe UI",system-ui,sans-serif}
  #orb{position:absolute;left:18px;top:18px;width:84px;height:84px;border-radius:50%;cursor:grab;
    background:radial-gradient(circle at 35% 30%,#3a3a40 0%,#16161a 55%,#050506 100%);
    box-shadow:0 6px 22px rgba(0,0,0,.45),inset 0 -6px 14px rgba(0,0,0,.6);transition:transform .15s}
  #orb:hover{transform:scale(1.05)} #orb.drag{cursor:grabbing;transform:scale(.92)}
  svg{position:absolute;inset:-8px;width:100px;height:100px;pointer-events:none}
  .ring{fill:none;stroke-width:3;transition:stroke .3s}
  #eyeW{position:absolute;left:22px;top:28px;width:40px;height:28px;border-radius:50%/60%;background:#f4f2ec;overflow:hidden;transition:height .12s,top .12s}
  #pupil{position:absolute;width:16px;height:16px;border-radius:50%;background:#111;left:12px;top:6px;box-shadow:inset 0 0 0 3px #ff5a1f}
  #pupil::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;left:3px;top:3px}
  #label{position:absolute;left:112px;top:38px;max-width:180px;padding:7px 12px;border-radius:12px;background:rgba(17,18,20,.92);
    color:#f6f6f2;font-size:12px;line-height:1.3;opacity:0;transform:translateX(-6px);transition:all .25s;pointer-events:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid #333}
  #label.show{opacity:1;transform:none}
  #label b{color:#ff5a1f;font-weight:700}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .spin{transform-origin:50px 50px;animation:spin 1.1s linear infinite}
  .pulse{animation:pulse 1s ease-in-out infinite}
</style></head>
<body>
<div id="orb">
  <svg viewBox="0 0 100 100">
    <circle class="ring" id="ring" cx="50" cy="50" r="46" stroke="#55555c" stroke-dasharray="6 6"/>
    <circle class="ring" id="arc" cx="50" cy="50" r="46" stroke="#ff5a1f" stroke-dasharray="70 220" style="display:none"/>
  </svg>
  <div id="eyeW"><div id="pupil"></div></div>
</div>
<div id="label"></div>
<script>
const ES=(navigator.language||'es').toLowerCase().startsWith('es');
const L=ES?{drop:'Suéltame sobre una ventana…',look:'Mirando…',full:'Pantalla completa',see:'Viendo:'}:{drop:'Drop me on a window…',look:'Looking…',full:'Full screen',see:'Watching:'};
const orb=document.getElementById('orb'),ring=document.getElementById('ring'),arc=document.getElementById('arc'),
  pupil=document.getElementById('pupil'),eyeW=document.getElementById('eyeW'),label=document.getElementById('label');
let dragging=false,moved=false,down=null,timer=null,target=null,labelT=null;

orb.addEventListener('mouseenter',()=>{orbe.mouseIgnore(false);if(target)showLabel();});
orb.addEventListener('mouseleave',()=>{if(!dragging)orbe.mouseIgnore(true);if(!dragging)hideLabel(800);});
orb.addEventListener('contextmenu',e=>{e.preventDefault();orbe.menu();});
orb.addEventListener('pointerdown',e=>{if(e.button!==0)return;orb.setPointerCapture(e.pointerId);dragging=true;moved=false;down={x:e.screenX,y:e.screenY};
  orbe.dragStart();timer=setInterval(()=>orbe.dragMove(),16);});
orb.addEventListener('pointermove',e=>{if(dragging&&down&&Math.hypot(e.screenX-down.x,e.screenY-down.y)>4){if(!moved){moved=true;orb.classList.add('drag');setLabel(L.drop);showLabel();}}});
orb.addEventListener('pointerup',async e=>{if(!dragging)return;dragging=false;clearInterval(timer);orb.classList.remove('drag');
  try{orb.releasePointerCapture(e.pointerId);}catch{}
  if(!moved){orbe.click();return;}
  setLabel(L.look);const t=await orbe.dragEnd(true);
  if(t){setTarget(t);showLabel();hideLabel(2600);}else{setLabel(L.full);hideLabel(1600);}});

function setLabel(h){label.innerHTML=h;}
function showLabel(){clearTimeout(labelT);label.classList.add('show');}
function hideLabel(ms){clearTimeout(labelT);labelT=setTimeout(()=>label.classList.remove('show'),ms);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function setTarget(t){target=t;if(t)setLabel(`<b>${L.see}</b> ${esc(t.title)}`);}

orbe.on('target',t=>{setTarget(t);});
orbe.on('state',s=>{
  arc.style.display='none';arc.classList.remove('spin');ring.classList.remove('pulse','spin');
  ring.setAttribute('stroke-dasharray','6 6');ring.setAttribute('stroke','#55555c');
  if(s==='locked'){ring.setAttribute('stroke','#ff5a1f');ring.setAttribute('stroke-dasharray','');}
  if(s==='scanning'){ring.setAttribute('stroke','#ff5a1f');ring.classList.add('spin');}
  if(s==='thinking'){arc.style.display='';arc.classList.add('spin');}
  if(s==='speaking'){ring.setAttribute('stroke','#ff5a1f');ring.setAttribute('stroke-dasharray','');ring.classList.add('pulse');}
});
orbe.on('cursor',({dx,dy})=>{const d=Math.hypot(dx,dy)||1,k=Math.min(1,d/300);pupil.style.left=(12+dx/d*k*11)+'px';pupil.style.top=(6+dy/d*k*6)+'px';});
// parpadeo
setInterval(()=>{eyeW.style.height='3px';eyeW.style.top='40px';setTimeout(()=>{eyeW.style.height='28px';eyeW.style.top='28px';},130);},4200+Math.random()*1500);
</script>
</body></html>
