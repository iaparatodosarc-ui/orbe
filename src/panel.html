<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Orbe</title>
<style>
:root{--bg:#121214;--card:#1b1b1f;--line:#2c2c32;--fg:#f2f1ec;--mute:#8e8e95;--or:#ff5a1f;--user:#26262c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;font-family:"Segoe UI",system-ui,sans-serif;color:var(--fg);font-size:14px}
#app{position:absolute;inset:6px;background:var(--bg);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
header{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;-webkit-app-region:drag;border-bottom:1px solid var(--line)}
.mini{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a40,#050506);box-shadow:inset 0 0 0 2px var(--or);position:relative}
.mini::after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#f4f2ec;box-shadow:inset 0 0 0 3px #111}
.ttl{flex:1;line-height:1.15}.ttl b{font-size:15px;letter-spacing:.3px}.ttl small{display:block;color:var(--mute);font-size:11px}
.ttl small i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ad37a;margin-right:5px;vertical-align:1px}
.ib{-webkit-app-region:no-drag;background:none;border:1px solid transparent;color:var(--mute);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;display:grid;place-items:center}
.ib:hover{background:var(--card);color:var(--fg);border-color:var(--line)}
#tbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
#tname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tname b{color:var(--fg);font-weight:600}
.tog{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.tog input{accent-color:var(--or)}
.sb{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer}
.sb:hover{border-color:var(--or)}
#msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
#msgs::-webkit-scrollbar{width:8px}#msgs::-webkit-scrollbar-thumb{background:#2c2c32;border-radius:8px}
.m{max-width:92%;line-height:1.5;word-wrap:break-word}
.u{align-self:flex-end;background:var(--user);padding:9px 12px;border-radius:14px 14px 4px 14px}
.u img{display:block;max-width:220px;max-height:140px;border-radius:8px;margin-bottom:6px;border:1px solid var(--line);cursor:zoom-in}
.a{align-self:flex-start;padding:2px 2px}
.a p{margin:0 0 8px}.a ul,.a ol{margin:4px 0 8px;padding-left:20px}
.a code{background:#26262c;padding:1px 5px;border-radius:5px;font-family:Consolas,monospace;font-size:12.5px}
.a pre{white-space:pre-wrap;padding-top:30px !important;background:#0b0b0d;border:1px solid var(--line);padding:10px;border-radius:10px;overflow-x:auto;position:relative}
.a pre code{background:none;padding:0}
.copy{position:absolute;top:6px;right:6px;font-size:11px}
.err{align-self:stretch;background:#2a1410;border:1px solid #6b2a1a;color:#ffb39a;padding:9px 12px;border-radius:10px;font-size:13px}
.hint{color:var(--mute);font-size:13px;text-align:center;margin:auto 10px;line-height:1.6}
.hint b{color:var(--fg)}
.cursor::after{content:"▍";color:var(--or);animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
#chips{display:flex;gap:6px;padding:6px 12px 0;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--or);color:#fff}
footer{display:flex;gap:8px;padding:10px 12px 12px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;max-height:140px;min-height:42px;outline:none}
textarea:focus{border-color:var(--or)}
#send{background:var(--or);color:#111;border:none;border-radius:12px;height:42px;min-width:42px;padding:0 14px;font-weight:700;cursor:pointer}
#send.stop{background:#33333a;color:var(--fg)}
#mic{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;height:42px;min-width:42px;font-size:17px;cursor:pointer;position:relative}
#mic:hover{border-color:var(--or)}
#mic.on{background:var(--or);color:#111;border-color:var(--or);animation:micp 1.2s ease-in-out infinite}
#mic.talk{border-color:var(--or);color:var(--or)}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(255,150,60,.55)}50%{box-shadow:0 0 0 8px rgba(255,150,60,0)}}
#set select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 11px;font:inherit;margin-top:4px;outline:none}
#set{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;padding:18px;gap:12px;z-index:5;overflow:auto}
#set.on{display:flex}
#set h3{margin:0 0 4px}#set label{font-size:12px;color:var(--mute)}
#set input[type=text],#set input[type=password]{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 11px;font:inherit;margin-top:4px;outline:none}
#set input:focus{border-color:var(--or)}
#set .note{font-size:12px;color:var(--mute);line-height:1.5}
#set a{color:var(--or);cursor:pointer}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:auto}
.btn{background:var(--or);border:none;color:#111;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer}
.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.card{align-self:stretch;background:var(--card);border:1px solid var(--or);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card .ch{font-size:12px;color:var(--mute)}.card .ch b{color:var(--fg)}
.card textarea{min-height:70px;max-height:200px;background:#0f0f12}
.card .cr{display:flex;gap:6px;flex-wrap:wrap}.card .btn{padding:7px 11px;font-size:13px}
.card .cn{font-size:11px;color:var(--mute);line-height:1.4}
.card.done{border-color:var(--line);opacity:.75}
.card img.draw{width:100%;max-width:320px;align-self:center;border-radius:10px;background:#fff;border:1px solid var(--line);cursor:zoom-in}
.ok{align-self:stretch;background:#10241a;border:1px solid #1d5a3a;color:#9ff0c2;padding:9px 12px;border-radius:10px;font-size:13px}
#set input[type=range]{width:100%;accent-color:var(--or)}
.sep{border-top:1px solid var(--line);margin:4px 0}
#zoom{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:9;cursor:zoom-out}
#zoom img{max-width:94%;max-height:94%;border-radius:8px}
</style></head>
<body>
<div id="app">
  <header>
    <div class="mini"></div>
    <div class="ttl"><b>Orbe</b><small><i></i><span id="prov">Claude</span> · <span data-i="live">en vivo</span></small></div>
    <button class="ib" id="bVoice" title="Leer respuestas en voz alta">🔇</button>
    <button class="ib" id="bNew" title="Nueva conversación">＋</button>
    <button class="ib" id="bSet" title="Configuración">⚙</button>
    <button class="ib" id="bHide" title="Ocultar (Ctrl+Shift+Espacio)">—</button>
  </header>
  <div id="tbar">
    <span id="tname">👁 <b>Pantalla completa</b></span>
    <label class="tog" title="Enviar una captura de la ventana con cada mensaje"><input type="checkbox" id="withScreen" checked><span data-i="see">Ver</span></label>
    <label class="tog" id="readWrap" style="display:none" title="Dejar que Orbe lea lo que hay dentro del archivo bajo el orbe"><input type="checkbox" id="readFile"><span data-i="readc">Leer contenido</span></label>
    <button class="sb" id="bShot" title="Tomar y mostrar la captura que verá Claude">📷</button>
  </div>
  <div id="msgs"><div class="hint" id="hint" data-ih="hint"></div></div>
  <div id="chips">
    <button class="chip" data-i="c1"></button>
    <button class="chip" data-i="c2"></button>
    <button class="chip" data-i="c3"></button>
    <button class="chip" data-i="c4"></button>
    <button class="chip" data-i="c5"></button>
    <button class="chip" data-i="c6"></button>
  </div>
  <footer>
    <button id="mic" data-t="micT">🎤</button>
    <textarea id="inp" rows="1" data-ip="ph"></textarea>
    <button id="send">➤</button>
  </footer>

  <div id="set">
    <h3 data-i="setTitle"></h3>
    <div class="note" id="welcome" data-ih="welcome" style="display:none;font-size:13px;color:var(--fg)"></div>
    <div><label data-i="key"></label><input type="password" id="sKey" placeholder="sk-ant-...">
      <div class="note"><span data-i="keyNote1"></span> <a id="lnk">console.anthropic.com</a> <span data-i="keyNote2"></span> <a id="sTest" data-i="test"></a> <span id="sTestR"></span></div></div>
    <div><label data-i="model"></label><input type="text" id="sModel" list="mlist" placeholder="claude-opus-5-5"><datalist id="mlist"></datalist>
      <div class="note" id="mnote"></div></div>
    <div class="sep"></div>
    <label class="tog" style="color:var(--fg)"><input type="checkbox" id="sSounds"> <span data-i="sounds"></span></label>
    <div><label data-i="volume"></label><input type="range" id="sVol" min="0" max="1" step="0.05"></div>
    <div class="sep"></div>
    <label class="tog" style="color:var(--fg)"><input type="checkbox" id="sReply"> <span data-i="reply"></span></label>
    <div class="note" data-ih="replyNote"></div>
    <div class="sep"></div>
    <label class="tog" style="color:var(--fg)"><input type="checkbox" id="sFiles"> <span data-i="files"></span></label>
    <div class="note" data-ih="filesNote"></div>
    <div class="sep"></div>
    <label class="tog" style="color:var(--fg)" id="talkWrap"><input type="checkbox" id="sTalk"> <span data-i="talk"></span></label>
    <div class="note" data-ih="talkNote" id="talkNoteEl"></div>
    <label class="tog" style="color:var(--fg)"><input type="checkbox" id="sVoice"> <span data-i="voice"></span></label>
    <div id="vWrap"><label data-i="ttsVoice"></label><select id="sTts"></select>
      <div style="display:flex;gap:10px;align-items:center;margin-top:8px"><label data-i="rate" style="white-space:nowrap"></label><input type="range" id="sRate" min="0.8" max="1.5" step="0.05" style="flex:1"><a id="sTryV" data-i="tryV" style="cursor:pointer;color:var(--or);font-size:12px;white-space:nowrap"></a></div>
      <label class="tog" style="color:var(--fg);margin-top:8px"><input type="checkbox" id="sConvo"> <span data-i="convo"></span></label>
      <div class="note" data-ih="voiceNote"></div></div>
    <div class="note" data-ih="setNote"></div>
    <div class="note" id="sVer" style="opacity:.7"></div>
    <div class="row"><button class="btn g" id="sCancel" data-i="close"></button><button class="btn" id="sSave" data-i="save"></button></div>
  </div>
  <div id="zoom"><img id="zimg"></div>
</div>

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function md(src){
  const blocks=[];src=src.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(_,l,c)=>{blocks.push(c);return `\u0000${blocks.length-1}\u0000`;});
  let h=esc(src);
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  h=h.replace(/^#{1,4} (.*)$/gm,'<b>$1</b>');
  const lines=h.split('\n');let out='',list=null;
  for(const ln of lines){const ul=ln.match(/^\s*[-•*] (.*)/),ol=ln.match(/^\s*\d+[.)] (.*)/);
    if(ul||ol){const t=ul?'ul':'ol';if(list!==t){if(list)out+=`</${list}>`;out+=`<${t}>`;list=t;}out+=`<li>${(ul||ol)[1]}</li>`;continue;}
    if(list){out+=`</${list}>`;list=null;}
    out+=ln.trim()?`<p>${ln}</p>`:'';}
  if(list)out+=`</${list}>`;
  return out.replace(/<p>\u0000(\d+)\u0000<\/p>|\u0000(\d+)\u0000/g,(_,a,b)=>`<pre><button class="sb copy">${T.copy}</button><code>${esc(blocks[a??b])}</code></pre>`);
}
function scroll(){msgs.scrollTop=msgs.scrollHeight;}
function add(cls,html){$('hint')?.remove();const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;msgs.appendChild(d);scroll();return d;}
function setBusy(b){busy=b;send.textContent=b?'■':'➤';send.classList.toggle('stop',b);}

async function ask(text,spoken){
  text=text.trim();if(!text||busy)return;
  stopSpeech();spokenTurn=!!spoken;firstChunk=true;sayBuf='';inp.readOnly=!!spoken;
  inp.value='';autoGrow();
  const u=add('u','');const withScreen=$('withScreen').checked;
  u.innerHTML=(withScreen?'<img alt="captura" style="display:none">':'')+(spoken?T.heard+' ':'')+esc(text).replace(/\n/g,'<br>');
  pendingShot=u.querySelector('img');
  cur=add('a cursor','');curText='';setBusy(true);
  const r=await orbe.ask(text,withScreen,$('readFile').checked,!!spoken);
  setBusy(false);cur.classList.remove('cursor');
  if(r.error){if(!curText)cur.remove();add('err',esc(ERR(r.error)));if(r.error==='nokey')openSet();if(pendingShot&&!pendingShot.src)pendingShot.remove();if(r.error==='stopped')stopSpeech();}
  else{if(r.text||curText){cur.innerHTML=md(r.text||curText);if(spokenTurn||voice){if(!curText&&r.text)feedSpeech(r.text,false);feedSpeech('',true);}}else cur.remove();(r.cards||[]).forEach(c=>c.kind==='draw'?drawCard(c):card(c));}
  cur=null;scroll();checkSpeechDone();
}
orbe.on('delta',t=>{if(!cur)return;curText+=t;cur.innerHTML=md(curText);scroll();if(spokenTurn||voice)feedSpeech(t,false);});
orbe.on('shot',url=>{if(pendingShot){if(url){pendingShot.src=url;pendingShot.style.display='block';}else pendingShot.remove();}});
orbe.on('target',t=>showTarget(t));
orbe.on('focus-input',()=>setTimeout(()=>inp.focus(),50));
orbe.on('open-settings',o=>openSet(o&&o.welcome));
function showTarget(t){
  const it=t&&t.item;
  if(it){const ic=it.kind==='folder'?'📁':it.kind==='file'?'📄':'🔹';const lab=it.kind==='folder'?T.folder:it.kind==='file'?T.file:T.icon;
    $('tname').innerHTML=`${ic} <b>${esc(it.name)}</b>`;$('tname').title=`${lab}: ${it.path||it.name}`;}
  else{$('tname').innerHTML=t?`👁 <b>${esc(t.title)}</b>`:`👁 <b>${T.full}</b>`;$('tname').title=t?`${t.title} — ${t.proc||''}`:'';}
  $('readWrap').style.display=it&&it.kind==='file'?'':'none';if(!(it&&it.kind==='file'))$('readFile').checked=false;
  // sugerencias según lo que mira el orbe
  const chips=[...document.querySelectorAll('.chip')];
  const set=it&&it.kind==='folder'?['fc1','fc2','fc3','c6']:it&&it.kind==='file'?['ff1','ff2','c3','c6']:['c1','c2','c3','c4','c5','c6'];
  chips.forEach((c,i)=>{if(set[i]){c.textContent=T[set[i]];c.style.display='';}else c.style.display='none';});
}
orbe.getTarget().then(showTarget);

send.onclick=()=>busy?orbe.stop():ask(inp.value);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(inp.value);}if(e.key==='Escape'){if(speaking()||micState==='listening'){stopListening();stopSpeech();}else orbe.hide();}});
function autoGrow(){inp.style.height='auto';inp.style.height=Math.min(140,inp.scrollHeight)+'px';}
inp.addEventListener('input',autoGrow);
inp.addEventListener('mousedown',()=>{if(micState!=='listening')inp.readOnly=false;});   // si quieres escribir mientras Orbe habla
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>ask(c.textContent));
msgs.addEventListener('click',e=>{
  if(e.target.classList.contains('copy')){navigator.clipboard.writeText(e.target.nextElementSibling.textContent);e.target.textContent=T.copied;setTimeout(()=>e.target.textContent=T.copy,1200);}
  if(e.target.tagName==='IMG'){$('zimg').src=e.target.src;$('zoom').style.display='grid';}
});
$('zoom').onclick=()=>$('zoom').style.display='none';
$('bHide').onclick=()=>orbe.hide();
$('bNew').onclick=()=>{orbe.newChat();msgs.innerHTML='';add('a',`<p>${T.newc}</p>`);};
$('bShot').onclick=async()=>{const u=await orbe.recapture();if(u){$('zimg').src=u;$('zoom').style.display='grid';}};

// voz
// Orbe habla frase por frase mientras Claude todavía escribe: empieza a hablar en ~1 s, sin esperar la respuesta completa.
const mic=$('mic');const IS_WIN_UI=/Windows/.test(navigator.userAgent);
let spokenTurn=false,firstChunk=true,sayBuf='',sayQ=[],playing=null,speakGen=0,micState='idle',convo=true,talkOn=false;
function setTalk(v){talkOn=!!v&&IS_WIN_UI;mic.style.display=talkOn?'':'none';if(!talkOn){stopListening();}}
setTalk(false);
function cleanSpeech(t){return t.replace(/```[\s\S]*?(```|$)/g,' ').replace(/`([^`]*)`/g,'$1').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
  .replace(/https?:\/\/\S+/g,'').replace(/\*\*|__|[*#>_~|]/g,'').replace(/^\s*[-•]\s+/gm,'').replace(/^\s*(\d+)[.)]\s+/gm,'$1. ')
  .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/\s+/g,' ').trim();}
function speaking(){return !!playing||sayQ.length>0;}
function feedSpeech(delta,final){
  sayBuf+=delta;
  for(;;){
    if(((sayBuf.match(/```/g)||[]).length%2)&&!final)break;           // dentro de un bloque de código: esperar a que cierre
    const min=firstChunk?14:60;const re=/[.!?…:;](\s)|[.!?…](?=$)|\n/g;let m,cut=-1;
    while((m=re.exec(sayBuf))){const end=m.index+m[0].length;const atEnd=end>=sayBuf.length&&!m[1]&&m[0]!=='\n';if(atEnd&&!final)break;if(end>=min){cut=end;break;}}
    if(cut<0){if(final&&sayBuf.trim()){enqueueSpeech(sayBuf);sayBuf='';}break;}
    enqueueSpeech(sayBuf.slice(0,cut));sayBuf=sayBuf.slice(cut);firstChunk=false;
  }
}
function enqueueSpeech(t){const c=cleanSpeech(t);if(c.replace(/[^\p{L}\p{N}]/gu,'').length<1)return;
  const it={text:c,p:IS_WIN_UI?orbe.tts(c):Promise.resolve(null)};sayQ.push(it);pumpSpeech(speakGen);}
// audio por Web Audio: así se puede medir la voz y dibujarla en la aureola del orbe
let actx=null,analyser=null,levelTimer=null,fbins=null,playingSrc=0;
function audioCtx(){if(!actx){actx=new AudioContext();analyser=actx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.55;analyser.connect(actx.destination);fbins=new Uint8Array(analyser.frequencyBinCount);}return actx;}
async function playWav(url,it){
  const ctx=audioCtx();if(ctx.state==='suspended')await ctx.resume();
  const bin=Uint8Array.from(atob(url.slice(url.indexOf(',')+1)),c=>c.charCodeAt(0));
  const buf=await ctx.decodeAudioData(bin.buffer);
  const src=ctx.createBufferSource();src.buffer=buf;src.connect(analyser);if(it)it.src=src;
  startLevels();playingSrc++;
  return new Promise(res=>{src.onended=()=>{playingSrc=Math.max(0,playingSrc-1);if(!playingSrc)stopLevels();res();};src.start();});
}
function startLevels(){if(levelTimer)return;levelTimer=setInterval(()=>{
  analyser.getByteFrequencyData(fbins);
  const out=[];for(let i=1;i<=24;i++){const v=fbins[i]/255;out.push(Math.round(Math.min(1,Math.max(0,(v-.25)/.65))*100)/100);}  // ~180 Hz a 4,5 kHz: la voz
  orbe.voiceLevel(out);},40);}
function stopLevels(){if(levelTimer){clearInterval(levelTimer);levelTimer=null;}orbe.voiceLevel(null);}
function sysSpeak(text){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(text);const lg=(navigator.language||'es').slice(0,2);
  const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(lg));if(v)u.voice=v;u.lang=v?.lang||navigator.language;u.onend=u.onerror=res;speechSynthesis.speak(u);}catch{res();}});}
async function pumpSpeech(gen){
  if(playing||!sayQ.length)return;
  const it=sayQ[0];playing=it;orbe.voiceState('speaking');mic.classList.add('talk');
  const r=await it.p;if(gen!==speakGen)return;
  if(r&&r.url){try{await playWav(r.url,it);}catch{await sysSpeak(it.text);}}
  else await sysSpeak(it.text);
  if(gen!==speakGen)return;
  sayQ.shift();playing=null;
  if(sayQ.length)pumpSpeech(gen);else checkSpeechDone();
}
function checkSpeechDone(){
  if(speaking()||busy||sayBuf.trim())return;
  mic.classList.remove('talk');orbe.voiceState('idle');inp.readOnly=false;
  if(spokenTurn&&convo&&IS_WIN_UI){spokenTurn=false;setTimeout(()=>startListening(true),250);}
  spokenTurn=false;
}
function stopSpeech(){speakGen++;for(const it of sayQ)try{it.src&&it.src.stop();}catch{}stopLevels();
  sayQ=[];playing=null;sayBuf='';try{speechSynthesis.cancel();}catch{}mic.classList.remove('talk');orbe.voiceState('idle');}
// Escuchar: Orbe abre el dictado de Windows (Windows + H) en su propio cuadro de texto y espera a que termines.
// Cuando el texto deja de cambiar ~1,6 s, cierra el dictado y envía la pregunta. Mientras Orbe habla, el cuadro
// queda de solo lectura, así el dictado nunca puede escribir lo que dice Pablo.
let vtTimer=null,vtLast='',vtSince=0,vtStart=0;
async function startListening(auto){
  if(!IS_WIN_UI){add('err',T.novoice);return;}
  if(micState==='listening'||busy)return;
  stopSpeech();micState='listening';mic.classList.add('on');
  inp.readOnly=false;inp.value='';autoGrow();inp.placeholder=T.listening;inp.focus();
  orbe.voiceState('listening');
  await orbe.vt('start');
  if(micState!=='listening')return;
  inp.focus();vtLast='';vtStart=vtSince=Date.now();
  clearInterval(vtTimer);
  vtTimer=setInterval(()=>{
    const v=inp.value.trim();
    if(v!==vtLast){vtLast=v;vtSince=Date.now();return;}
    if(v&&Date.now()-vtSince>1600)finishListening(true,auto);
    else if(!v&&Date.now()-vtStart>(auto?9000:14000))finishListening(false,auto);
  },200);
}
async function finishListening(send,auto){
  if(micState!=='listening')return;
  clearInterval(vtTimer);micState='idle';mic.classList.remove('on');inp.placeholder=T.ph;
  inp.readOnly=true;mic.focus();          // fuera del cuadro de texto: el dictado deja de escribir
  await orbe.vt('stop');
  orbe.voiceState('idle');
  const text=inp.value.trim();
  if(send&&text){ask(text,true);return;}
  inp.readOnly=false;
  if(!text&&!auto)add('a',`<p>${T.notheard}</p>`);   // en conversación continua, si nadie habla, Orbe se queda tranquilo
}
function stopListening(){if(micState==='listening'){inp.value='';finishListening(false,true);}}
function micPress(){if(!talkOn)return;if(micState==='listening'){finishListening(true,false);return;}if(busy){orbe.stop();}stopSpeech();startListening(false);}
mic.onclick=micPress;
orbe.on('voice-toggle',micPress);
orbe.on('voice-stop',()=>{stopListening();stopSpeech();spokenTurn=false;});
function setVoice(v){voice=v;$('bVoice').textContent=v?'🔊':'🔇';if(!v&&!spokenTurn)stopSpeech();}
$('bVoice').onclick=async()=>{setVoice(!voice);await orbe.setCfg({voice});};

// borradores de respuesta (responder por ti)
function card(c){
  const d=add('card','');
  d.innerHTML=`<div class="ch">✍ <b>${c.para?T.to+': '+esc(c.para):T.draft}</b></div><textarea></textarea>
    <div class="cr"><button class="btn" data-a="write">${T.auth}</button><button class="btn g" data-a="copy">${T.copyD}</button><button class="btn g" data-a="discard">${T.discard}</button></div>
    <div class="cn">${c.canWrite?T.cardNote:T.cardNoTarget}</div>`;
  const ta=d.querySelector('textarea');ta.value=c.text;
  d.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
    const a=b.dataset.a;d.querySelectorAll('button').forEach(x=>x.disabled=true);
    const r=await orbe.replyAction(c.id,a,ta.value);
    if(r.ok){d.classList.add('done');ta.disabled=true;add('ok',esc(a==='write'?T.written:a==='copy'?T.copiedD:T.discarded));}
    else{add('err',esc(ERR(r.error)));if(r.error==='typefail'){d.classList.add('done');ta.disabled=true;}else d.querySelectorAll('button').forEach(x=>x.disabled=false);if(r.error==='replyoff')openSet();}
  });
}

// dibujos: el SVG se muestra seguro como imagen y se convierte a PNG para pegar/guardar
function svgUrl(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}
function toPng(svg){return new Promise((ok,bad)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=1024;c.height=1024;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1024,1024);x.drawImage(im,0,0,1024,1024);ok(c.toDataURL('image/png'));};im.onerror=bad;im.src=svgUrl(svg);});}
function drawCard(c){
  const d=add('card','');
  d.innerHTML=`<div class="ch">🎨 <b>${esc(c.title||T.draw)}</b></div><img class="draw" alt="">
    <div class="cr"><button class="btn" data-a="paste">${T.pasteD}</button><button class="btn g" data-a="copy">${T.copyD}</button><button class="btn g" data-a="save">${T.saveD}</button></div>
    <div class="cn">${T.drawNote}</div>`;
  d.querySelector('img').src=svgUrl(c.svg);
  d.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
    const a=b.dataset.a;let png;try{png=await toPng(c.svg);}catch{add('err',esc(ERR('bad')));return;}
    const r=await orbe.drawAction(c.id,a,png);
    if(r.ok)add('ok',esc(a==='paste'?T.pasted:a==='save'?T.savedD:T.copiedD));
    else if(r.error!=='canceled')add('err',esc(r.error==='nopaste'||r.error==='typefail'?T.nopaste:ERR(r.error)));
  });
}

// configuración
async function openSet(welcome){const c=await orbe.getCfg();$('sKey').value=c.apiKey||'';$('sModel').value=c.model||'';
  $('mlist').innerHTML=(c.models||[]).map(m=>`<option value="${m.id}">${esc(m.label)}</option>`).join('');$('mnote').textContent=T.mnote;
  $('sVoice').checked=!!c.voice;$('sSounds').checked=c.sounds!==false;$('sVol').value=c.volume??.6;$('sReply').checked=!!c.allowReply;$('sFiles').checked=!!c.allowFiles;$('sVer').textContent=T.ver+' '+(c.version||'');$('sTestR').textContent='';
  $('vWrap').style.display=IS_WIN_UI?'':'none';$('talkWrap').style.display=$('talkNoteEl').style.display=IS_WIN_UI?'':'none';$('sTalk').checked=!!c.allowTalk;$('sRate').value=c.ttsRate||1;$('sConvo').checked=c.convo!==false;
  if(IS_WIN_UI){const vs=await orbe.voices();const sel=$('sTts');vs.sort((a,b)=>(b.lang.startsWith('es')-a.lang.startsWith('es')));
    sel.innerHTML=`<option value="">${T.autoV}</option>`+vs.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');sel.value=c.ttsVoice||'';}
  $('welcome').style.display=(welcome||!c.onboarded)?'':'none';
  $('set').classList.add('on');setTimeout(()=>$('sKey').focus(),50);}
$('bSet').onclick=()=>openSet(false);$('sCancel').onclick=()=>$('set').classList.remove('on');
$('lnk').onclick=()=>orbe.openUrl('https://console.anthropic.com/settings/keys');
function cfgFromForm(){return{apiKey:$('sKey').value,model:$('sModel').value,voice:$('sVoice').checked,sounds:$('sSounds').checked,volume:+$('sVol').value,allowReply:$('sReply').checked,allowFiles:$('sFiles').checked,ttsVoice:$('sTts').value||'',ttsRate:+$('sRate').value||1,convo:$('sConvo').checked,allowTalk:$('sTalk').checked,onboarded:true};}
$('sTest').onclick=async()=>{$('sTestR').textContent=T.testing;await orbe.setCfg(cfgFromForm());const r=await orbe.testKey();$('sTestR').textContent=r.ok?T.testok:'⚠ '+ERR(r.error);};
$('sSave').onclick=async()=>{await orbe.setCfg(cfgFromForm());
  setVoice($('sVoice').checked);convo=$('sConvo').checked;setTalk($('sTalk').checked);$('set').classList.remove('on');add('a',`<p>${T.saved}</p>`);};
orbe.getCfg().then(c=>{setVoice(!!c.voice);convo=c.convo!==false;setTalk(c.allowTalk);});
$('sTryV').onclick=async()=>{stopSpeech();const r=await orbe.tts(T.tryText,{voice:$('sTts').value||'',rate:+$('sRate').value||1});if(r&&r.url){orbe.voiceState('speaking');playWav(r.url,null).catch(()=>{}).then(()=>orbe.voiceState('idle'));}else sysSpeak(T.tryText);};
</script>
