<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Orbe</title>
<style>
:root{--bg:#121214;--card:#1b1b1f;--line:#2c2c32;--fg:#f2f1ec;--mute:#8e8e95;--or:#ff5a1f;--user:#26262c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;font-family:"Segoe UI",system-ui,sans-serif;color:var(--fg);font-size:14px}
#app{position:absolute;inset:6px;background:var(--bg);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
header{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;-webkit-app-region:drag;border-bottom:1px solid var(--line)}
.mini{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a40,#050506);box-shadow:inset 0 0 0 2px var(--or);position:relative}
.mini::after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#f4f2ec;box-shadow:inset 0 0 0 3px #111}
.ttl{flex:1;line-height:1.15}.ttl b{font-size:15px;letter-spacing:.3px}.ttl small{display:block;color:var(--mute);font-size:11px}
.ttl small i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ad37a;margin-right:5px;vertical-align:1px}
.ib{-webkit-app-region:no-drag;background:none;border:1px solid transparent;color:var(--mute);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;display:grid;place-items:center}
.ib:hover{background:var(--card);color:var(--fg);border-color:var(--line)}
#tbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
#tname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tname b{color:var(--fg);font-weight:600}
.tog{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.tog input{accent-color:var(--or)}
.sb{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer}
.sb:hover{border-color:var(--or)}
#msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
#msgs::-webkit-scrollbar{width:8px}#msgs::-webkit-scrollbar-thumb{background:#2c2c32;border-radius:8px}
.m{max-width:92%;line-height:1.5;word-wrap:break-word}
.u{align-self:flex-end;background:var(--user);padding:9px 12px;border-radius:14px 14px 4px 14px}
.u img{display:block;max-width:220px;max-height:140px;border-radius:8px;margin-bottom:6px;border:1px solid var(--line);cursor:zoom-in}
.a{align-self:flex-start;padding:2px 2px}
.a p{margin:0 0 8px}.a ul,.a ol{margin:4px 0 8px;padding-left:20px}
.a code{background:#26262c;padding:1px 5px;border-radius:5px;font-family:Consolas,monospace;font-size:12.5px}
.a pre{white-space:pre-wrap;padding-top:30px !important;background:#0b0b0d;border:1px solid var(--line);padding:10px;border-radius:10px;overflow-x:auto;position:relative}
.a pre code{background:none;padding:0}
.copy{position:absolute;top:6px;right:6px;font-size:11px}
.err{align-self:stretch;background:#2a1410;border:1px solid #6b2a1a;color:#ffb39a;padding:9px 12px;border-radius:10px;font-size:13px}
.hint{color:var(--mute);font-size:13px;text-align:center;margin:auto 10px;line-height:1.6}
.hint b{color:var(--fg)}
.cursor::after{content:"▍";color:var(--or);animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
#chips{display:flex;gap:6px;padding:6px 12px 0;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--or);color:#fff}
footer{display:flex;gap:8px;padding:10px 12px 12px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;max-height:140px;min-height:42px;outline:none}
textarea:focus{border-color:var(--or)}
#send{background:var(--or);color:#111;border:none;border-radius:12px;height:42px;min-width:42px;padding:0 14px;font-weight:700;cursor:pointer}
#send.stop{background:#33333a;color:var(--fg)}
#set{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;padding:18px;gap:12px;z-index:5;overflow:auto}
#set.on{display:flex}
#set h3{margin:0 0 4px}#set label{font-size:12px;color:var(--mute)}
#set input[type=text],#set input[type=password]{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 11px;font:inherit;margin-top:4px;outline:none}
#set input:focus{border-color:var(--or)}
#set .note{font-size:12px;color:var(--mute);line-height:1.5}
#set a{color:var(--or);cursor:pointer}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:auto}
.btn{background:var(--or);border:none;color:#111;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer}
.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--line)}
#zoom{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:9;cursor:zoom-out}
#zoom img{max-width:94%;max-height:94%;border-radius:8px}
</style></head>
<body>
<div id="app">
  <header>
    <div class="mini"></div>
    <div class="ttl"><b>Orbe</b><small><i></i><span id="prov">Claude</span> · <span data-i="live">en vivo</span></small></div>
    <button class="ib" id="bVoice" title="Leer respuestas en voz alta">🔇</button>
    <button class="ib" id="bNew" title="Nueva conversación">＋</button>
    <button class="ib" id="bSet" title="Configuración">⚙</button>
    <button class="ib" id="bHide" title="Ocultar (Ctrl+Shift+Espacio)">—</button>
  </header>
  <div id="tbar">
    <span id="tname">👁 <b>Pantalla completa</b></span>
    <label class="tog" title="Enviar una captura de la ventana con cada mensaje"><input type="checkbox" id="withScreen" checked><span data-i="see">Ver</span></label>
    <button class="sb" id="bShot" title="Tomar y mostrar la captura que verá Claude">📷</button>
  </div>
  <div id="msgs"><div class="hint" id="hint" data-ih="hint"></div></div>
  <div id="chips">
    <button class="chip" data-i="c1"></button>
    <button class="chip" data-i="c2"></button>
    <button class="chip" data-i="c3"></button>
    <button class="chip" data-i="c4"></button>
    <button class="chip" data-i="c5"></button>
  </div>
  <footer>
    <textarea id="inp" rows="1" data-ip="ph"></textarea>
    <button id="send">➤</button>
  </footer>

  <div id="set">
    <h3 data-i="setTitle"></h3>
    <div class="note" id="welcome" data-ih="welcome" style="display:none;font-size:13px;color:var(--fg)"></div>
    <div><label data-i="provider"></label>
      <select id="sProv" style="width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px;margin-top:4px">
        <option value="anthropic">Claude (Anthropic API)</option>
        <option value="ollama">Ollama (local, gratis)</option>
      </select></div>
    <div id="boxA">
      <div><label data-i="key"></label><input type="password" id="sKey" placeholder="sk-ant-...">
        <div class="note"><span data-i="keyNote1"></span> <a id="lnk">console.anthropic.com</a> <span data-i="keyNote2"></span></div></div>
      <div style="margin-top:10px"><label data-i="model"></label><input type="text" id="sModel" placeholder="claude-opus-5-5"></div>
    </div>
    <div id="boxO" style="display:none">
      <div><label>URL</label><input type="text" id="sOUrl" placeholder="http://localhost:11434"></div>
      <div style="margin-top:10px"><label data-i="model"></label><input type="text" id="sOModel" placeholder="qwen2.5vl"></div>
      <div class="note" data-ih="ollamaNote"></div>
    </div>
    <label class="tog" style="color:var(--fg)"><input type="checkbox" id="sVoice"> <span data-i="voice"></span></label>
    <div class="note" data-ih="setNote"></div>
    <div class="row"><button class="btn g" id="sCancel" data-i="close"></button><button class="btn" id="sSave" data-i="save"></button></div>
  </div>
  <div id="zoom"><img id="zimg"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const ES=(navigator.language||'es').toLowerCase().startsWith('es');
const T=ES?{
 live:'en vivo',see:'Ver',ph:'Pregúntale a Orbe…  (Enter para enviar)',c1:'¿Qué ves aquí?',c2:'Resúmelo',c3:'Explícame este error',c4:'Ayúdame a responder',c5:'¿Qué hago ahora?',
 hint:'<b>Arrastra el orbe</b> sobre cualquier ventana o pestaña<br>y pregúntame lo que quieras sobre lo que ves.<br><br>Atajo: <b>Ctrl + Shift + Espacio</b> → mira la ventana activa.<br>Dictado por voz: <b>Win + H</b> en el cuadro de texto.',
 setTitle:'Configuración',provider:'Motor de IA',key:'API key de Anthropic',keyNote1:'Créala en',keyNote2:'→ API Keys. Se guarda cifrada en este equipo. El uso de la API se cobra según consumo.',model:'Modelo',
 ollamaNote:'Instala <b>Ollama</b> (ollama.com) y un modelo con visión, por ejemplo: <code>ollama pull qwen2.5vl</code>. Todo queda en tu PC.',
 voice:'Leer respuestas en voz alta',setNote:'Atajo global: <b>Ctrl + Shift + Espacio</b>. Clic derecho sobre el orbe para más opciones o para salir.',close:'Cerrar',save:'Guardar',
 welcome:'<b>¡Bienvenido a Orbe!</b> 3 pasos:<br>1. Elige el motor de IA y pega tu API key.<br>2. Arrastra el orbe sobre cualquier ventana.<br>3. Haz clic en el orbe y pregunta.',
 saved:'Listo, configuración guardada. Arrastra el orbe sobre una ventana y pregúntame algo.',newc:'Conversación nueva. ¿En qué te ayudo?',full:'Pantalla completa',
 nokey:'Falta configurar el motor de IA. Ábrelo en ⚙.',busy:'Espera a que termine la respuesta anterior.',stopped:'Detenido.',copy:'Copiar',copied:'¡Copiado!'
}:{
 live:'live',see:'See',ph:'Ask Orbe…  (Enter to send)',c1:'What do you see?',c2:'Summarize it',c3:'Explain this error',c4:'Help me reply',c5:'What should I do next?',
 hint:'<b>Drag the orb</b> onto any window or tab<br>and ask me anything about what you see.<br><br>Shortcut: <b>Ctrl + Shift + Space</b> → look at the active window.',
 setTitle:'Settings',provider:'AI engine',key:'Anthropic API key',keyNote1:'Create it at',keyNote2:'→ API Keys. Stored encrypted on this device. API usage is billed per use.',model:'Model',
 ollamaNote:'Install <b>Ollama</b> (ollama.com) and a vision model, e.g. <code>ollama pull qwen2.5vl</code>. Everything stays on your PC.',
 voice:'Read answers aloud',setNote:'Global shortcut: <b>Ctrl + Shift + Space</b>. Right-click the orb for more options or to quit.',close:'Close',save:'Save',
 welcome:'<b>Welcome to Orbe!</b> 3 steps:<br>1. Pick the AI engine and paste your API key.<br>2. Drag the orb onto any window.<br>3. Click the orb and ask.',
 saved:'Settings saved. Drag the orb onto a window and ask me something.',newc:'New conversation. How can I help?',full:'Full screen',
 nokey:'Set up the AI engine first (⚙).',busy:'Wait for the current answer to finish.',stopped:'Stopped.',copy:'Copy',copied:'Copied!'
};
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[e.dataset.i]);
document.querySelectorAll('[data-ih]').forEach(e=>e.innerHTML=T[e.dataset.ih]);
document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=T[e.dataset.ip]);
const ERR=c=>T[c]||c;

const msgs=$('msgs'),inp=$('inp'),send=$('send');
let busy=false,cur=null,curText='',pendingShot=null,voice=false;

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function md(src){
  const blocks=[];src=src.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(_,l,c)=>{blocks.push(c);return `\u0000${blocks.length-1}\u0000`;});
  let h=esc(src);
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  h=h.replace(/^#{1,4} (.*)$/gm,'<b>$1</b>');
  const lines=h.split('\n');let out='',list=null;
  for(const ln of lines){const ul=ln.match(/^\s*[-•*] (.*)/),ol=ln.match(/^\s*\d+[.)] (.*)/);
    if(ul||ol){const t=ul?'ul':'ol';if(list!==t){if(list)out+=`</${list}>`;out+=`<${t}>`;list=t;}out+=`<li>${(ul||ol)[1]}</li>`;continue;}
    if(list){out+=`</${list}>`;list=null;}
    out+=ln.trim()?`<p>${ln}</p>`:'';}
  if(list)out+=`</${list}>`;
  return out.replace(/<p>\u0000(\d+)\u0000<\/p>|\u0000(\d+)\u0000/g,(_,a,b)=>`<pre><button class="sb copy">${T.copy}</button><code>${esc(blocks[a??b])}</code></pre>`);
}
function scroll(){msgs.scrollTop=msgs.scrollHeight;}
function add(cls,html){$('hint')?.remove();const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;msgs.appendChild(d);scroll();return d;}
function setBusy(b){busy=b;send.textContent=b?'■':'➤';send.classList.toggle('stop',b);}

async function ask(text){
  text=text.trim();if(!text||busy)return;
  inp.value='';autoGrow();
  const u=add('u','');const withScreen=$('withScreen').checked;
  u.innerHTML=(withScreen?'<img alt="captura" style="display:none">':'')+esc(text).replace(/\n/g,'<br>');
  pendingShot=u.querySelector('img');
  cur=add('a cursor','');curText='';setBusy(true);
  const r=await orbe.ask(text,withScreen);
  setBusy(false);cur.classList.remove('cursor');
  if(r.error){if(!curText)cur.remove();add('err',esc(ERR(r.error)));if(r.error==='nokey')openSet();if(pendingShot&&!pendingShot.src)pendingShot.remove();}
  else{cur.innerHTML=md(r.text||curText);speak(r.text||curText);}
  cur=null;scroll();
}
orbe.on('delta',t=>{if(!cur)return;curText+=t;cur.innerHTML=md(curText);scroll();});
orbe.on('shot',url=>{if(pendingShot){if(url){pendingShot.src=url;pendingShot.style.display='block';}else pendingShot.remove();}});
orbe.on('target',t=>showTarget(t));
orbe.on('focus-input',()=>setTimeout(()=>inp.focus(),50));
orbe.on('open-settings',o=>openSet(o&&o.welcome));
function showTarget(t){$('tname').innerHTML=t?`👁 <b>${esc(t.title)}</b>`:`👁 <b>${T.full}</b>`;$('tname').title=t?`${t.title} — ${t.proc||''}`:'';}
orbe.getTarget().then(showTarget);

send.onclick=()=>busy?orbe.stop():ask(inp.value);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(inp.value);}if(e.key==='Escape')orbe.hide();});
function autoGrow(){inp.style.height='auto';inp.style.height=Math.min(140,inp.scrollHeight)+'px';}
inp.addEventListener('input',autoGrow);
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>ask(c.textContent));
msgs.addEventListener('click',e=>{
  if(e.target.classList.contains('copy')){navigator.clipboard.writeText(e.target.nextElementSibling.textContent);e.target.textContent=T.copied;setTimeout(()=>e.target.textContent=T.copy,1200);}
  if(e.target.tagName==='IMG'){$('zimg').src=e.target.src;$('zoom').style.display='grid';}
});
$('zoom').onclick=()=>$('zoom').style.display='none';
$('bHide').onclick=()=>orbe.hide();
$('bNew').onclick=()=>{orbe.newChat();msgs.innerHTML='';add('a',`<p>${T.newc}</p>`);};
$('bShot').onclick=async()=>{const u=await orbe.recapture();if(u){$('zimg').src=u;$('zoom').style.display='grid';}};

// voz
function speak(t){if(!voice||!t)return;speechSynthesis.cancel();const clean=t.replace(/```[\s\S]*?```/g,' (código) ').replace(/[*#`>_-]/g,'');
  const u=new SpeechSynthesisUtterance(clean);const lg=(navigator.language||'es').slice(0,2);const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(lg));if(v)u.voice=v;u.lang=v?.lang||navigator.language;u.rate=1.05;speechSynthesis.speak(u);}
function setVoice(v){voice=v;$('bVoice').textContent=v?'🔊':'🔇';if(!v)speechSynthesis.cancel();}
$('bVoice').onclick=async()=>{setVoice(!voice);await orbe.setCfg({voice});};

// configuración
function provUI(){const o=$('sProv').value==='ollama';$('boxA').style.display=o?'none':'';$('boxO').style.display=o?'':'none';}
$('sProv').onchange=provUI;
async function openSet(welcome){const c=await orbe.getCfg();$('sProv').value=c.provider||'anthropic';$('sKey').value=c.apiKey||'';$('sModel').value=c.model||'';
  $('sOUrl').value=c.ollamaUrl||'';$('sOModel').value=c.ollamaModel||'';$('sVoice').checked=!!c.voice;$('welcome').style.display=(welcome||!c.onboarded)?'':'none';
  provUI();$('set').classList.add('on');setTimeout(()=>$('sKey').focus(),50);}
$('bSet').onclick=()=>openSet(false);$('sCancel').onclick=()=>$('set').classList.remove('on');
$('lnk').onclick=()=>orbe.openUrl('https://console.anthropic.com/settings/keys');
$('sSave').onclick=async()=>{await orbe.setCfg({provider:$('sProv').value,apiKey:$('sKey').value,model:$('sModel').value,ollamaUrl:$('sOUrl').value,ollamaModel:$('sOModel').value,voice:$('sVoice').checked,onboarded:true});
  setVoice($('sVoice').checked);$('set').classList.remove('on');$('prov').textContent=$('sProv').value==='ollama'?'Ollama':'Claude';add('a',`<p>${T.saved}</p>`);};
orbe.getCfg().then(c=>{$('prov').textContent=c.provider==='ollama'?'Ollama':'Claude';});
orbe.getCfg().then(c=>setVoice(!!c.voice));
</script>
</body></html>
